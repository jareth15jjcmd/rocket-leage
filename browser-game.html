<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turbo Arena — Browser Prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08111f;color:#eef5ff;font:16px system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:14px}main{width:min(100%,1200px)}header{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}h1{font-size:clamp(20px,4vw,30px);margin:0}.hud{display:flex;gap:12px;align-items:center;background:#142238;padding:9px 14px;border-radius:12px;font-weight:700}canvas{display:block;width:100%;height:auto;border:2px solid #3c5878;border-radius:14px;background:#172e37;touch-action:none}p{color:#c5d5e8;line-height:1.5;margin:10px 2px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{background:#1e3856;color:white;border:1px solid #547493;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}button:hover{background:#2a4b70}.mobile{display:none;gap:8px;justify-content:center;margin-top:10px}.mobile button{min-width:60px;min-height:50px;font-size:18px;touch-action:none}@media(max-width:650px){.mobile{display:flex;flex-wrap:wrap}}
</style></head><body><main>
<header><h1>⚽ Turbo Arena</h1><div class="hud"><span>BLUE <b id="blue">0</b></span><span>—</span><span><b id="orange">0</b> ORANGE (BOT)</span><span id="clock">90s</span></div></header>
<canvas id="game" width="1280" height="760" aria-label="Top-down car soccer game"></canvas>
<p><b>Controls:</b> W / ↑ accelerate · S / ↓ reverse · A / ← and D / → steer · Space or Shift boost · R restart. You are BLUE; score in the blue goal on the right. The orange bot chases the ball and tries to score in your goal.</p>
<div class="controls"><button id="restart">Restart match</button><button id="pause">Pause</button></div>
<div class="mobile"><button data-key="ArrowLeft">◀</button><button data-key="ArrowUp">▲</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button><button data-key=" ">BOOST</button></div>
<script>
(()=> {
const c=document.getElementById('game'),ctx=c.getContext('2d'),W=c.width,H=c.height;
const keys=new Set();let blue=0,orange=0,time=90,paused=false,last=0,goalFlash=0,goalText='GOAL!';
const player={x:260,y:H/2,a:0,v:0,r:24,team:'blue'};
const bot={x:W-260,y:H/2,a:Math.PI,v:0,r:24,team:'orange'};
const ball={x:W/2,y:H/2,vx:0,vy:0,r:17};
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function reset(keepScore=true){player.x=260;player.y=H/2;player.a=0;player.v=0;bot.x=W-260;bot.y=H/2;bot.a=Math.PI;bot.v=0;ball.x=W/2;ball.y=H/2;ball.vx=ball.vy=0;if(!keepScore){blue=orange=0;time=90;document.getElementById('blue').textContent=blue;document.getElementById('orange').textContent=orange;}}
function keydown(e){if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys.add(e.key.toLowerCase());if(e.key.toLowerCase()==='r')reset(false);}
function keyup(e){keys.delete(e.key.toLowerCase());}
addEventListener('keydown',keydown);addEventListener('keyup',keyup);
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key.toLowerCase();b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(k)});for(const ev of ['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,()=>keys.delete(k));});
document.getElementById('restart').onclick=()=>reset(false);
document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'Resume':'Pause';};
function score(team){if(team==='blue'){blue++;goalText='BLUE SCORES!';}else{orange++;goalText='BOT SCORES!';}document.getElementById('blue').textContent=blue;document.getElementById('orange').textContent=orange;goalFlash=1.1;reset(true);}
function collideWithBall(car,power){const dx=ball.x-car.x,dy=ball.y-car.y,d=Math.hypot(dx,dy),min=car.r+ball.r;if(d<min){const nx=dx/(d||1),ny=dy/(d||1),over=min-d;ball.x+=nx*over;ball.y+=ny*over;const forward=car.v*(Math.cos(car.a)*nx+Math.sin(car.a)*ny);const impact=Math.max(0,forward);ball.vx+=nx*(125+impact*power);ball.vy+=ny*(125+impact*power);car.v*=0.91;}}
function movePlayer(dt){const up=keys.has('w')||keys.has('arrowup'),down=keys.has('s')||keys.has('arrowdown'),left=keys.has('a')||keys.has('arrowleft'),right=keys.has('d')||keys.has('arrowright'),boost=keys.has('shift')||keys.has(' ');
if(left)player.a-=3.15*dt*(Math.abs(player.v)>8?Math.sign(player.v):1);if(right)player.a+=3.15*dt*(Math.abs(player.v)>8?Math.sign(player.v):1);
if(up)player.v+=(boost?720:470)*dt;if(down)player.v-=330*dt;player.v*=Math.pow(0.989,dt*60);player.v=clamp(player.v,-260,boost?720:520);
player.x+=Math.cos(player.a)*player.v*dt;player.y+=Math.sin(player.a)*player.v*dt;player.x=clamp(player.x,45+player.r,W-45-player.r);player.y=clamp(player.y,45+player.r,H-45-player.r);collideWithBall(player,1.65);}
function moveBot(dt){const dx=ball.x-bot.x,dy=ball.y-bot.y;const desired=Math.atan2(dy,dx);let diff=Math.atan2(Math.sin(desired-bot.a),Math.cos(desired-bot.a));
// Bot follows the ball, and aims slightly toward the player's goal when close to it.
bot.a+=clamp(diff,-2.6*dt,2.6*dt);
const facing=Math.cos(diff);bot.v+= (facing>0.15?365:100)*dt;bot.v*=Math.pow(0.992,dt*60);bot.v=clamp(bot.v,-90,440);
bot.x+=Math.cos(bot.a)*bot.v*dt;bot.y+=Math.sin(bot.a)*bot.v*dt;
bot.x=clamp(bot.x,45+bot.r,W-45-bot.r);bot.y=clamp(bot.y,45+bot.r,H-45-bot.r);
collideWithBall(bot,1.45);
// Keep cars from occupying the exact same space.
const px=bot.x-player.x,py=bot.y-player.y,pd=Math.hypot(px,py),min=bot.r+player.r;if(pd<min){const nx=px/(pd||1),ny=py/(pd||1),over=(min-pd)/2;player.x-=nx*over;player.y-=ny*over;bot.x+=nx*over;bot.y+=ny*over;}}
function update(dt){if(paused)return;time=Math.max(0,time-dt);document.getElementById('clock').textContent=Math.ceil(time)+'s';if(time<=0){paused=true;document.getElementById('pause').textContent='Resume';}
movePlayer(dt);moveBot(dt);
const top=45,bottom=H-45,leftWall=45,rightWall=W-45,goalHalf=112;
if(ball.y-ball.r<top){ball.y=top+ball.r;ball.vy=Math.abs(ball.vy)*.86}if(ball.y+ball.r>bottom){ball.y=bottom-ball.r;ball.vy=-Math.abs(ball.vy)*.86}
if(ball.x-ball.r<leftWall){if(Math.abs(ball.y-H/2)<goalHalf){score('orange');return;}ball.x=leftWall+ball.r;ball.vx=Math.abs(ball.vx)*.86}
if(ball.x+ball.r>rightWall){if(Math.abs(ball.y-H/2)<goalHalf){score('blue');return;}ball.x=rightWall-ball.r;ball.vx=-Math.abs(ball.vx)*.86}
ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vx*=Math.pow(.996,dt*60);ball.vy*=Math.pow(.996,dt*60);
ball.vx=clamp(ball.vx,-780,780);ball.vy=clamp(ball.vy,-780,780);goalFlash=Math.max(0,goalFlash-dt);}
function drawCar(car,color,trim,label){ctx.save();ctx.translate(car.x,car.y);ctx.rotate(car.a);ctx.fillStyle='rgba(0,0,0,.32)';ctx.fillRect(-22,-13,48,32);ctx.fillStyle='#101a25';ctx.fillRect(-17,-19,11,7);ctx.fillRect(12,-19,11,7);ctx.fillRect(-17,12,11,7);ctx.fillRect(12,12,11,7);ctx.fillStyle=color;ctx.fillRect(-24,-16,48,32);ctx.fillStyle=trim;ctx.fillRect(-7,-12,17,24);ctx.fillStyle='#182a3b';ctx.fillRect(9,-10,10,20);ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(27,0);ctx.lineTo(16,-7);ctx.lineTo(16,7);ctx.fill();ctx.restore();ctx.fillStyle=color;ctx.font='bold 15px system-ui';ctx.textAlign='center';ctx.fillText(label,car.x,car.y-32);ctx.textAlign='left';}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#123e3d';ctx.fillRect(0,0,W,H);ctx.fillStyle='#1b6651';ctx.fillRect(45,45,W-90,H-90);
ctx.fillStyle='#ed8b36';ctx.fillRect(0,H/2-112,45,224);ctx.fillStyle='#4db9ff';ctx.fillRect(W-45,H/2-112,45,224);
ctx.strokeStyle='rgba(236,250,245,.75)';ctx.lineWidth=4;ctx.strokeRect(45,45,W-90,H-90);ctx.beginPath();ctx.moveTo(W/2,45);ctx.lineTo(W/2,H-45);ctx.stroke();ctx.beginPath();ctx.arc(W/2,H/2,100,0,Math.PI*2);ctx.stroke();ctx.strokeRect(45,H/2-155,145,310);ctx.strokeRect(W-190,H/2-155,145,310);ctx.strokeRect(45,H/2-75,65,150);ctx.strokeRect(W-110,H/2-75,65,150);
ctx.fillStyle='rgba(5,15,20,.28)';ctx.fillRect(0,0,W,38);ctx.fillStyle='#e8f4ff';ctx.font='bold 18px system-ui';ctx.fillText('TURBO ARENA • BLUE vs ORANGE BOT',20,26);
ctx.beginPath();ctx.arc(ball.x+4,ball.y+5,ball.r+2,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,.25)';ctx.fill();ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle='#f8fafc';ctx.fill();ctx.strokeStyle='#25364a';ctx.lineWidth=2;ctx.stroke();ctx.beginPath();ctx.arc(ball.x,ball.y,6,0,Math.PI*2);ctx.fillStyle='#25364a';ctx.fill();
drawCar(player,'#43b7ff','#e9f7ff','YOU');drawCar(bot,'#ff7a3d','#ffe0c9','BOT');
if(goalFlash>0){ctx.fillStyle='rgba(255,255,255,'+(goalFlash*.35)+')';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='bold 60px system-ui';ctx.textAlign='center';ctx.fillText(goalText,W/2,H/2);ctx.textAlign='left';}
if(paused){ctx.fillStyle='rgba(0,0,0,.48)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='bold 48px system-ui';ctx.textAlign='center';ctx.fillText(time<=0?'MATCH OVER':'PAUSED',W/2,H/2);ctx.textAlign='left';}}
function frame(now){const dt=Math.min((now-last)/1000||0,0.033);last=now;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();</script></main></body></html>
